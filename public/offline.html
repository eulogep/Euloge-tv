<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MJTV — Hors ligne</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0f;
        --fg: #f4f4f6;
        --muted: #8a8a99;
        --accent: #7c3aed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin-bottom: 1.5rem;
        opacity: 0.6;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem 0;
        font-weight: 600;
      }
      p {
        color: var(--muted);
        max-width: 32rem;
        line-height: 1.5;
        margin: 0;
      }
      .hint {
        margin-top: 1.5rem;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .accent {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <svg
      class="icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <path
        d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"
      />
    </svg>
    <h1>MJTV est hors ligne</h1>
    <p>
      Vous pouvez consulter les chaînes lorsque votre connexion sera rétablie.
      <span class="accent"> Aucune vidéo n'est mise en cache.</span>
    </p>
    <p class="hint">Reconnectez-vous à Internet, puis rechargez la page.</p>
  </body>
</html>
