name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: MJTV
          NEXT_PUBLIC_DEFAULT_COUNTRY: FR
          NEXT_PUBLIC_DEFAULT_LANGUAGE: fra
          NEXT_PUBLIC_ENABLE_DEBUG: "false"
          NEXT_PUBLIC_ENABLE_EPG: "false"
          IPTV_DATA_REVALIDATE_SECONDS: "21600"

  e2e-chromium:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium E2E
        run: npx playwright test --project=chromium --project=mobile-chromium
        env:
          CI: "true"

  e2e-webkit:
    name: Playwright WebKit
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Run WebKit E2E
        run: npx playwright test --project=webkit --project=mobile-webkit
        env:
          CI: "true"
